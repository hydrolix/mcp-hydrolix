name: Tests Pipeline

on:
  pull_request:
  workflow_dispatch:

jobs:
  core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
      - name: Build and run Docker Compose services
        run: docker compose up -d --wait --wait-timeout 300
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
      # Same check build-release-artifacts.yml runs before a release, here so a
      # drifted or schema-invalid server.json fails the PR that introduces it.
      - name: Check server.json (version and schema)
        run: uv run --no-project --with 'jsonschema>=4,<5' python scripts/check_server_json.py
      - name: Run tests
        run: |
          uv sync --frozen --no-editable --all-extras
          uv run pytest -m "not end_to_end"
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down
