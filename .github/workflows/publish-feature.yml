name: Publish feature branch to GAR

on:
  workflow_dispatch:

concurrency:
  group: publish-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-feature-docker:
    name: Publish feature branch to GAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # mint the GitHub OIDC token exchanged for GCP credentials
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          SANITIZED=$(echo "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=branch-${SANITIZED}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - name: Authenticate GAR (Workload Identity Federation)
        uses: ./.github/actions/setup-google-application-credentials
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - name: Build docker image
        shell: bash
        run: |
          docker buildx build \
            -t us-docker.pkg.dev/hdx-art/t/mcp-hydrolix:${{ steps.tag.outputs.tag }} \
            .
      - name: Push docker image
        shell: bash
        run: |
          docker push us-docker.pkg.dev/hdx-art/t/mcp-hydrolix:${{ steps.tag.outputs.tag }}
      - name: Print image reference
        run: |
          echo "::notice::Image published: us-docker.pkg.dev/hdx-art/t/mcp-hydrolix:${{ steps.tag.outputs.tag }}"
