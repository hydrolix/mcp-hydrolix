[project]
name = "mcp-hydrolix"
version = "0.3.9"
# description, readme, scripts, and urls are brand-varying and populated by the
# custom metadata hook in hatch_build.py (default brand: hydrolix). project.name
# stays static because uv/PEP 621 forbid a dynamic name; the mcp-trafficpeak
# distribution is produced by the build hook repackaging the artifact.
dynamic = ["description", "readme", "scripts", "urls"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    # floor pinned to clear AIKIDO-2026-996382 (fastmcp) and AIKIDO-2026-535246
    # (fastmcp-slim), both fixed in 3.4.0, and GHSA-7xgj-8392-5q4r (fastmcp and
    # fastmcp-slim; fixed in 3.4.10).
    "fastmcp>=3.4.10,<3.5",
    # mcp is pulled in transitively via fastmcp; floor pinned to clear
    # CVE-2026-59950 / 52870 / 52869 (all fixed in 1.28.1) and AIKIDO-2026-639016
    # (fixed in 1.30.0).
    "mcp>=1.30.0,<2",
    # anyio is the transitive async runtime (fastmcp/mcp/httpx/uvicorn);
    # floor pinned to clear AIKIDO-2026-889297 (critical; fixed in 4.14.2).
    "anyio>=4.14.2,<5",
    "python-dotenv>=1.1,<1.3",
    "clickhouse-connect>=0.15,<0.16",
    # floor pinned to clear AIKIDO-2026-221830 (high) / 983970 (fixed in 0.10.5).
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.34,<1.0",
    # floor pinned to clear CVE-2026-102268 (critical), 102273 / 102272 / 102271 /
    # 102267 / 102266 (high) and 102274 / 101917 / 102265 / 102269 (fixed in 2.14.0).
    "pyjwt>=2.14.0,<3",
    "sqlglot>=26.0,<27.0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "mcp-clickhouse==0.1.13",
    "kubernetes>=30,<32",
    "httpx>=0.27,<0.29",
]

[tool.uv]
# Floors for transitive dependencies, pinned to clear CVEs. These constrain
# uv's lockfile resolution without declaring the packages as direct deps.
constraint-dependencies = [
    # via authlib; CVE-2026-69247 (high; fixed in 50.0.0), CVE-2026-69248 / 69249.
    "cryptography>=50.0.0",
    # via fastmcp-slim; CVE-2026-44681 (fixed in 1.6.12), CVE-2026-96760
    # (critical), 114615 / 114616 / 116672 (high), 114614 / 114617 / 114618 /
    # 114619 / 114620 (fixed in 1.9.1).
    "authlib>=1.9.1",
    # via clickhouse-connect/httpx/requests; GHSA-6q48-6c7w-9gw2 (critical;
    # fixed in 2026.10.18).
    "certifi>=2026.10.18",
    # via email-validator; CVE-2026-114605 (fixed in 2.9.0).
    "dnspython>=2.9.0",
    # via fastmcp-slim; CVE-2026-114603 (fixed in 1.45.1).
    "opentelemetry-api>=1.45.1",
    # via authlib/fastmcp-slim; CVE-2026-119283 / 119284 (fixed in 1.7.6).
    "joserfc>=1.7.6",
    # via clickhouse-connect/requests; AIKIDO-2026-740601 / 499214 (high),
    # 997635 / 193495 / 499458 (fixed in 2.8.0).
    "urllib3>=2.8.0",
    # via kubernetes (dev); CVE-2026-49265 / 49264 (fixed in 4.0.0).
    "oauthlib>=4.0.0",
    # via fastmcp-slim and virtualenv (dev); AIKIDO-2026-777134 (fixed in 4.11.11).
    "platformdirs>=4.11.11",
    # via rich; AIKIDO-2026-425066 (fixed in 4.1.0).
    "markdown-it-py>=4.1.0",
    # via anyio/httpx/requests; CVE-2026-45409 (fixed in 3.15).
    "idna>=3.15",
]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["mcp_hydrolix"]
# The committed mcp_hydrolix/_brand.py holds Hydrolix defaults for dev/editable
# installs; the build hook force-includes a freshly generated copy so the baked
# brand matches MCP_BRAND. Exclude the source copy to avoid a duplicate-path.
exclude = ["mcp_hydrolix/_brand.py"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration_clickhouse: tests that require a running ClickHouse/Hydrolix instance",
    "end_to_end: end-to-end tests that deploy to and exercise a live Hydrolix Kubernetes cluster",
    "brand_build: tests that shell out to build a brand wheel (slower; needs uv)",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
